<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Ilham ERP</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 28px 26px 24px;
  }

  .auth-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }

  .auth-brand .brand-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: var(--primary-light);
    border-radius: 12px;
    font-size: 24px;
  }

  .auth-brand-title { font-weight: 700; font-size: 17px; }
  .auth-brand-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    background: var(--bg);
    border-radius: 11px;
    margin-bottom: 22px;
  }

  .auth-tab {
    margin: 0;
    justify-content: center;
    background: transparent;
    color: var(--text-muted);
    padding: 9px 12px;
  }

  .auth-tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--primary-dark);
    box-shadow: 0 1px 4px rgba(17, 24, 39, 0.10);
  }

  .auth-tab:focus-visible,
  .auth-submit:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .auth-title { margin: 0 0 4px; font-size: 20px; }
  .auth-lead { margin: 0 0 18px; font-size: 13.5px; color: var(--text-muted); }

  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .auth-field input { width: 100%; }

  .auth-show {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin: -4px 0 16px;
    cursor: pointer;
  }

  .auth-show input { width: auto; margin: 0; }

  .auth-submit { width: 100%; justify-content: center; margin: 0; }
  .auth-submit[disabled] { opacity: .65; cursor: wait; }

  .auth-message {
    display: none;
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.45;
  }

  .auth-message.is-error { display: block; background: var(--danger-bg); color: var(--danger); }
  .auth-message.is-success { display: block; background: var(--success-bg); color: var(--success); }

  .auth-note { margin: 18px 0 0; font-size: 12.5px; color: var(--text-faint); text-align: center; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <span class="brand-icon"><i class="ico-calculator"></i></span>
      <div>
        <div class="auth-brand-title">Ilham ERP</div>
        <div class="auth-brand-sub">Accounting Learning System</div>
      </div>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="Pilih Masuk atau Daftar">
      <button type="button" class="auth-tab" id="tabLogin" role="tab" aria-selected="true">Masuk</button>
      <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false">Daftar</button>
    </div>

    <h1 class="auth-title" id="authTitle">Masuk ke akunmu</h1>
    <p class="auth-lead" id="authLead">Gunakan email dan kata sandi yang kamu daftarkan.</p>

    <form id="authForm" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="nama@email.com" required>
      </div>

      <div class="auth-field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Minimal 6 karakter" required>
      </div>

      <div class="auth-field" id="confirmField" hidden>
        <label for="passwordConfirm">Ulangi kata sandi</label>
        <input type="password" id="passwordConfirm" autocomplete="new-password" placeholder="Ketik ulang kata sandi">
      </div>

      <label class="auth-show">
        <input type="checkbox" id="showPassword">
        Tampilkan kata sandi
      </label>

      <button type="submit" class="auth-submit" id="submitBtn">Masuk</button>

      <div class="auth-message" id="authMessage" role="alert" aria-live="polite"></div>
    </form>

    <p class="auth-note">Data akunmu disimpan aman dan hanya bisa dilihat olehmu.</p>

  </div>
</div>

<script>
  (function () {
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const form = document.getElementById("authForm");
    const title = document.getElementById("authTitle");
    const lead = document.getElementById("authLead");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmField = document.getElementById("confirmField");
    const confirmInput = document.getElementById("passwordConfirm");
    const showPassword = document.getElementById("showPassword");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("authMessage");

    let mode = "login";

    function setMessage(text, type) {
      message.textContent = text || "";
      message.className = "auth-message" + (text ? " is-" + type : "");
    }

    function setMode(newMode) {
      mode = newMode;
      const isSignup = mode === "signup";

      tabLogin.setAttribute("aria-selected", String(!isSignup));
      tabSignup.setAttribute("aria-selected", String(isSignup));

      title.textContent = isSignup ? "Buat akun baru" : "Masuk ke akunmu";
      lead.textContent = isSignup
        ? "Daftar sekali, lalu data usahamu tersimpan di akunmu."
        : "Gunakan email dan kata sandi yang kamu daftarkan.";
      submitBtn.textContent = isSignup ? "Daftar" : "Masuk";
      passwordInput.autocomplete = isSignup ? "new-password" : "current-password";

      confirmField.hidden = !isSignup;
      confirmInput.value = "";
      setMessage("");
    }

    function setBusy(isBusy) {
      submitBtn.disabled = isBusy;
      if (isBusy) {
        submitBtn.textContent = "Memproses...";
      } else {
        submitBtn.textContent = mode === "signup" ? "Daftar" : "Masuk";
      }
    }

    function goNext() {
      location.replace(ERPAuth.nextFromUrl());
    }

    tabLogin.addEventListener("click", () => setMode("login"));
    tabSignup.addEventListener("click", () => setMode("signup"));

    showPassword.addEventListener("change", () => {
      const type = showPassword.checked ? "text" : "password";
      passwordInput.type = type;
      confirmInput.type = type;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("");

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("Isi email dan kata sandi terlebih dahulu.", "error");
        return;
      }

      if (mode === "signup") {
        if (password.length < 6) {
          setMessage("Kata sandi minimal 6 karakter.", "error");
          return;
        }
        if (password !== confirmInput.value) {
          setMessage("Kata sandi dan ulangannya belum sama.", "error");
          return;
        }
      }

      setBusy(true);

      const result = mode === "signup"
        ? await ERPAuth.signUp(email, password)
        : await ERPAuth.signIn(email, password);

      if (!result.ok) {
        setBusy(false);
        setMessage(result.message, "error");
        return;
      }

      if (result.needsConfirm) {
        setBusy(false);
        setMessage("Akun dibuat. Cek emailmu untuk verifikasi, lalu kembali ke sini dan masuk.", "success");
        setMode("login");
        setMessage("Akun dibuat. Cek emailmu untuk verifikasi, lalu masuk.", "success");
        return;
      }

      goNext();
    });

    // Kalau sudah login sebelumnya, langsung masuk ke ERP.
    ERPAuth.getSession().then(session => {
      if (session) goNext();
    });
  })();
</script>

</body>
</html>

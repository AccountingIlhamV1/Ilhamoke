<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Umum - Ilham ERP</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Buka menu"><i class="ico-menu"></i></button>
        <div>
          <h1 id="topbarTitle">Jurnal Umum</h1>
          <p id="topbarSubtitle">Dibuat otomatis dari transaksi usaha aktif</p>
        </div>
      </div>
      <div class="active-badge" id="activeBusinessBadge">Memuat usaha...</div>
    </header>

    <main class="content">

      <div class="card">

        <div class="info-box">
          Jurnal ini dibuat otomatis berdasarkan transaksi dari usaha yang sedang aktif.
          <span id="periodNote"></span>
        </div>

        <div class="actions-row" style="margin:10px 0">
          <button class="btn-save" onclick="handleExport('xlsx')"><i class=ico-sheet></i> Export Excel</button>
          <button class="btn-save" onclick="handleExport('pdf')"><i class=ico-file-text></i> Export PDF</button>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <span>Total Debit</span>
            <strong id="totalDebit">Rp0</strong>
          </div>
          <div class="summary-box">
            <span>Total Kredit</span>
            <strong id="totalCredit">Rp0</strong>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table-wide">
            <thead>
              <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Keterangan</th>
                <th>Akun</th>
                <th class="number">Debit</th>
                <th class="number">Kredit</th>
              </tr>
            </thead>
            <tbody id="journalTable"></tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="4">TOTAL</td>
                <td class="number" id="footerDebit">Rp0</td>
                <td class="number" id="footerCredit">Rp0</td>
              </tr>
            </tfoot>
          </table>
        </div>

      </div>

    </main>

  </div>

</div>

<script src="assets/app.js"></script>
<script src="assets/export.js"></script>
<script>

  ERP.initLayout({
    active: "journal",
    title: "Jurnal Umum",
    subtitle: "Dibuat otomatis dari transaksi usaha aktif, jurnal penutup tampil terpisah"
  });

  function renderJournal() {
    const table = document.getElementById("journalTable");
    table.innerHTML = "";

    const business = ERP.getActiveBusiness();
    document.getElementById("periodNote").textContent = " " + ERP.periodLabel(business);

    const transactions = ERP.filterEntriesFromDate(ERP.getActiveTransactions(), ERP.getPeriodStart(business))
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)));

    let totalDebit = 0;
    let totalCredit = 0;

    const closingEntries = getClosingForJournal(business);

    if (transactions.length === 0 && closingEntries.length === 0) {
      table.innerHTML = `<tr><td colspan="6" class="empty">Belum ada transaksi untuk usaha aktif.</td></tr>`;
      updateTotals(0, 0);
      return;
    }

    transactions.forEach((transaction, index) => {
      const amount = Number(transaction.amount) || 0;
      const debitAccount = ERP.getAccountById(transaction.debitAccountId);
      const creditAccount = ERP.getAccountById(transaction.creditAccountId);

      const debitLabel = debitAccount ? `${debitAccount.code} - ${debitAccount.name}` : "Akun tidak ditemukan";
      const creditLabel = creditAccount ? `${creditAccount.code} - ${creditAccount.name}` : "Akun tidak ditemukan";

      const debitRow = document.createElement("tr");
      debitRow.innerHTML = `
        <td rowspan="2">${index + 1}</td>
        <td rowspan="2">${ERP.escapeHTML(transaction.date || "-")}</td>
        <td rowspan="2">${ERP.escapeHTML(transaction.description || "-")}</td>
        <td class="debit">${ERP.escapeHTML(debitLabel)}</td>
        <td class="number debit">${ERP.formatMoney(amount)}</td>
        <td class="number">-</td>
      `;
      table.appendChild(debitRow);

      const creditRow = document.createElement("tr");
      creditRow.innerHTML = `
        <td class="credit" style="padding-left:35px">${ERP.escapeHTML(creditLabel)}</td>
        <td class="number">-</td>
        <td class="number credit">${ERP.formatMoney(amount)}</td>
      `;
      table.appendChild(creditRow);

      totalDebit += amount;
      totalCredit += amount;
    });

    // Jurnal penutup ditampilkan sebagai kelompok terpisah di bawah transaksi biasa.
    if (closingEntries.length > 0) {
      const header = document.createElement("tr");
      header.innerHTML = `<td colspan="6" style="background:var(--warning-bg, #fef3c7);font-weight:700;">Jurnal Penutup <span style="font-weight:400;">(menutup akun Pendapatan/Beban ke ekuitas, bukan transaksi kasir)</span></td>`;
      table.appendChild(header);

      closingEntries.forEach((entry, i) => {
        const amount = Number(entry.amount) || 0;
        const debitAccount = ERP.getAccountById(entry.debitAccountId);
        const creditAccount = ERP.getAccountById(entry.creditAccountId);

        const debitLabel = debitAccount ? `${debitAccount.code} - ${debitAccount.name}` : "Akun tidak ditemukan";
        const creditLabel = creditAccount ? `${creditAccount.code} - ${creditAccount.name}` : "Akun tidak ditemukan";
        const badge = `<span style="display:inline-block;padding:1px 8px;border-radius:999px;background:var(--warning-bg, #fef3c7);font-size:11px;font-weight:700;">PENUTUP</span>`;

        const debitRow = document.createElement("tr");
        debitRow.innerHTML = `
          <td rowspan="2">${transactions.length + i + 1}</td>
          <td rowspan="2">${ERP.escapeHTML(entry.date || "-")}</td>
          <td rowspan="2">${badge} ${ERP.escapeHTML(entry.reference || "-")}<br>${ERP.escapeHTML(entry.description || "-")}</td>
          <td class="debit">${ERP.escapeHTML(debitLabel)}</td>
          <td class="number debit">${ERP.formatMoney(amount)}</td>
          <td class="number">-</td>
        `;
        table.appendChild(debitRow);

        const creditRow = document.createElement("tr");
        creditRow.innerHTML = `
          <td class="credit" style="padding-left:35px">${ERP.escapeHTML(creditLabel)}</td>
          <td class="number">-</td>
          <td class="number credit">${ERP.formatMoney(amount)}</td>
        `;
        table.appendChild(creditRow);

        totalDebit += amount;
        totalCredit += amount;
      });
    }

    updateTotals(totalDebit, totalCredit);
  }

  // Jurnal penutup usaha aktif, mengikuti filter tanggal periode yang sama dengan transaksi.
  function getClosingForJournal(business) {
    return ERP.filterEntriesFromDate(ERP.getActiveClosingJournalEntries(), ERP.getPeriodStart(business))
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.reference).localeCompare(String(b.reference)));
  }

  function updateTotals(totalDebit, totalCredit) {
    document.getElementById("totalDebit").textContent = ERP.formatMoney(totalDebit);
    document.getElementById("totalCredit").textContent = ERP.formatMoney(totalCredit);
    document.getElementById("footerDebit").textContent = ERP.formatMoney(totalDebit);
    document.getElementById("footerCredit").textContent = ERP.formatMoney(totalCredit);
  }

  function handleExport(format) {
    const business = ERP.getActiveBusiness();
    const transactions = ERP.filterEntriesFromDate(ERP.getActiveTransactions(), ERP.getPeriodStart(business))
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)));

    const closingEntries = business ? getClosingForJournal(business) : [];

    if (!business || (transactions.length === 0 && closingEntries.length === 0)) {
      alert("Tidak ada data untuk diexport.");
      return;
    }

    const entries = transactions.map(t => ({
      date: t.date,
      reference: t.invoice,
      description: t.description,
      debit: ERP.getAccountById(t.debitAccountId),
      credit: ERP.getAccountById(t.creditAccountId),
      amount: t.amount
    })).concat(closingEntries.map(c => ({
      date: c.date,
      reference: c.reference,
      description: "[Penutup] " + (c.description || ""),
      debit: ERP.getAccountById(c.debitAccountId),
      credit: ERP.getAccountById(c.creditAccountId),
      amount: c.amount
    })));

    ERP.exportReport(format || "xlsx", `Jurnal-Umum-${business.name}.xlsx`, [
      ERP.buildJournalSheet({ title: "Jurnal Umum", sheetName: "Jurnal Umum", businessName: business.name, period: business.period, entries })
    ]);
  }

  renderJournal();

</script>

</body>
</html>
